<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic UPI QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #222;
            font-size: 20px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #007bff;
        }
        #qrcode {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .amount-preview {
            margin-top: 5px;
            font-size: 16px;
            font-weight: bold;
            color: #28a745;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>UPI QR Generator</h2>

    <div class="form-group">
        <label for="accountSelect">खाता चुनें (Name):</label>
        <select id="accountSelect">
          <option value="9045865935@ybl">Singhal sanitary</option>
            <option value="8126145289@ptyes">Radhika</option>
            <option value="7599221105@ibl">Pinki gupta</option>
            <option value="9927245142@ptsbi">Abhishek</option>
            <option value="7817940870@ptaxis">Prachi</option>
        </select>
    </div>

    <div class="form-group">
        <label for="amount">रुपये (Amount):</label>
        <input type="number" id="amount" placeholder="उदा. 312" min="1" step="any">
    </div>

    <div id="amountPreview" class="amount-preview"></div>
    <div id="qrcode"></div>
</div>

<script>
    let qrInstance = null;
    const accountSelect = document.getElementById('accountSelect');
    const amountInput = document.getElementById('amount');
    const qrContainer = document.getElementById('qrcode');
    const preview = document.getElementById('amountPreview');

    function updateQR() {
        const upiId = accountSelect.value;
        const amount = amountInput.value.trim();

        if (!amount || Number(amount) <= 0) {
            qrContainer.innerHTML = "";
            preview.innerText = "";
            return;
        }

        const upiString = `upi://pay?pa=${upiId}&am=${amount}&cu=INR`;

        qrContainer.innerHTML = "";

        qrInstance = new QRCode(qrContainer, {
            text: upiString,
            width: 220,
            height: 220,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        preview.innerText = `₹${amount} के लिए QR कोड`;
    }

    accountSelect.addEventListener('change', updateQR);
    amountInput.addEventListener('input', updateQR);
</script>

</body>
</html>
